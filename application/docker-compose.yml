services:

  postgres:
    image: postgres:16-alpine
    container_name: aether-postgres
    restart: always
    environment:
      POSTGRES_DB: aether_stream
      POSTGRES_USER: aether_user
      POSTGRES_PASSWORD: aether_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/V1__init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether_user -d aether_stream"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aether-net
  redis:
    image: redis:7-alpine
    container_name: aether-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aether-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aether-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aether-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aether-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aether-net
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: aether-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aether_admin
      MINIO_ROOT_PASSWORD: aether_secret_key_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - aether-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: aether-keycloak
    restart: always
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password_2026
      KC_HTTP_PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aether-net
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: aether-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aether_stream
      SPRING_DATASOURCE_USERNAME: aether_user
      SPRING_DATASOURCE_PASSWORD: aether_password_2026
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: aether_admin
      MINIO_SECRET_KEY: aether_secret_key_2026
    networks:
      - aether-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: aether-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - aether-net

networks:
  aether-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
